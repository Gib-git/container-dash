version: "3.9"

services:
  dashboard:
    build: .
    container_name: griddock
    restart: unless-stopped
    ports:
      - "3006:3006"
    volumes:
      - .:/app
      # Shadows the host node_modules with the image's Linux-compiled copy,
      # preventing macOS native modules from breaking the container.
      - /app/node_modules
    environment:
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
    # Uncomment to reach services on host ports from inside the container:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
